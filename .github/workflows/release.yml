name: Release

# 打 tag（v*）时自动：构建 macOS .app → 打 .dmg → 上传到 GitHub Release。
# 也可手动 workflow_dispatch 触发（只构建，不上传，便于先验证能否打包）。
#
# 当前为**ad-hoc 签名**版本（codesign --sign -）：满足 Apple Silicon 对代码签名的
# 硬性要求（未签名的 arm64 二进制会被内核直接杀掉），但**不等于**可信分发——
# 产物仍无开发者证书、未公证，首次打开需右键「打开」或在系统设置里放行。
# 日后拿到 Apple Developer 账号，把签名步骤换成 Developer ID + notarytool + staple 即可。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write            # 上传 Release 资产需要

jobs:
  build-macos:
    # BarKit 依赖 pyobjc + PySide6，只能在 macOS 上构建。
    # macos-latest = Apple Silicon(arm64)，与随包的 arm64 hev 二进制一致。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --locked --group dev

      - name: 构建 .app
        run: |
          uname -m
          # 用 --with 叠加 PyInstaller：避免 `uv run` 按锁文件同步时把它当多余包移除。
          uv run --with pyinstaller pyinstaller --noconfirm packaging/BarKit.spec --distpath dist --workpath build

      - name: ad-hoc 签名
        run: |
          set -euo pipefail
          APP="dist/BarKit.app"
          # 清掉可能妨碍签名的扩展属性（CI 上一般没有，写上更稳）
          xattr -cr "$APP"
          # --deep：连同 Frameworks/ 里的 PySide6、PyObjC 与插件二进制一起签，
          # 否则 arm64 下未签名的 dylib/可执行文件会在加载时被内核拒绝。
          codesign --force --deep --sign - --timestamp=none "$APP"
          # 立刻验一遍：签名无效就别产出 dmg
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | sed -n '1,8p'

      - name: 打包 .dmg
        run: |
          set -euo pipefail
          APP="dist/BarKit.app"
          DMG="dist/BarKit-${{ github.ref_name }}-${{ runner.arch }}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"   # 拖拽安装到「应用程序」
          hdiutil create -volname "BarKit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG }}
          generate_release_notes: true
