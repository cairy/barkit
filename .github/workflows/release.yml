name: Release

# 打 tag（v*）时自动：构建 macOS .app → 打 .dmg → 上传到 GitHub Release。
# 也可手动 workflow_dispatch 触发（只构建，不上传，便于先验证能否打包）。
#
# 当前为**ad-hoc 签名**版本（codesign --sign -）：满足 Apple Silicon 对代码签名的
# 硬性要求（未签名的 arm64 二进制会被内核直接杀掉），但**不等于**可信分发——
# 产物仍无开发者证书、未公证，首次打开需去隔离（xattr）或在系统设置里「仍要打开」。
# 日后拿到 Apple Developer 账号，把签名步骤换成 Developer ID + notarytool + staple 即可。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write            # 上传 Release 资产需要

jobs:
  build-macos:
    # BarKit 依赖 pyobjc + PySide6，只能在 macOS 上构建。
    # macos-latest = Apple Silicon(arm64)，与随包的 arm64 hev 二进制一致。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --locked --group dev

      - name: 构建 .app
        run: |
          uname -m
          # 用 --with 叠加 PyInstaller：避免 `uv run` 按锁文件同步时把它当多余包移除。
          uv run --with pyinstaller pyinstaller --noconfirm packaging/BarKit.spec --distpath dist --workpath build

      - name: ad-hoc 签名
        run: |
          set -uo pipefail
          APP="dist/BarKit.app"
          LOG="$RUNNER_TEMP/codesign.log"
          : > "$LOG"
          log() { echo "$*" | tee -a "$LOG"; }

          summary() {
            { echo "### ad-hoc 签名"; echo '```'; tail -60 "$LOG"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ ! -d "$APP" ]]; then
            log "::error::$APP 不存在"; ls -la dist | tee -a "$LOG"; summary; exit 1
          fi

          # 清掉可能妨碍签名的扩展属性
          xattr -cr "$APP"

          # PyInstaller 对带点的嵌套 .app（bt_guard 的 BTHelper.app）做「目录改名 +
          # 双向交叉链接」，同一个 bundle 被劈成两半（Frameworks 侧只有可执行文件，
          # Resources 侧只有 Info.plist/签名），两边都不自洽：
          #   1) codesign 会报 ELOOP；
          #   2) 运行期 `open -n` 报 "Launchd job spawn failed"，蓝牙助手起不来。
          # 用仓库里的原始 .app 把**两侧**都覆盖成真实完整目录。
          DST="$APP/Contents/Frameworks/barkit/plugins/bt_guard/resources"
          RDST="$APP/Contents/Resources/barkit/plugins/bt_guard/resources"
          SRC="src/barkit/plugins/bt_guard/resources/BTHelper.app"
          if [[ -d "$DST" && -d "$SRC" ]]; then
            rm -rf "$DST/BTHelper.app" "$DST/BTHelper__dot__app"
            cp -R "$SRC" "$DST/BTHelper.app"
            if [[ -d "$RDST" ]]; then
              rm -rf "$RDST/BTHelper.app"
              cp -R "$SRC" "$RDST/BTHelper.app"
            fi
            log "已用原始 BTHelper.app 替换两侧的拆分目录"
          fi

          fail=0
          # codesign 的报错同时转成 ::error:: 注解：Actions 页面可见，
          # 也无需仓库管理员权限就能通过 check-run annotations API 读到原文。
          sign_one() {
            local target="$1" out
            if out=$(codesign --force --sign - "$target" 2>&1); then
              printf '%s\n' "$out" >>"$LOG"
            else
              printf '%s\n' "$out" >>"$LOG"
              log "::error::签名失败 ${target#"$PWD"/}: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-400)"
              fail=1
            fi
          }

          # 由内向外逐个签 Mach-O（.so / .dylib / 可执行文件），最后签 .app 本身。
          # 嵌套 .app 的内部文件不在这里签：整包签会重做它的封存，逐个签反而会破坏 seal。
          while IFS= read -r -d '' f; do
            case "$f" in
              *.app/Contents/*) continue ;;
            esac
            if file -b "$f" | grep -q 'Mach-O'; then
              sign_one "$f"
            fi
          done < <(find "$APP/Contents" -type f ! -path '*/_CodeSignature/*' -print0)

          # 嵌套 .app 作为 bundle 整体签（内部可执行文件与资源由 codesign 一次处理）
          while IFS= read -r -d '' nested; do
            sign_one "$nested"
          done < <(find "$APP/Contents/Frameworks" -type d -name '*.app' -print0)

          # 打包自检：助手必须是自洽的真实 bundle —— 缺了这步，坏包会静默发出去
          # （v0.1.1 就是这样：蓝牙助手 open 不起来，唤醒重连永远失败）。
          HELPER="$DST/BTHelper.app"
          if [[ -d "$HELPER" ]]; then
            for rel in Contents/Info.plist Contents/MacOS/bt-helper \
                       Contents/_CodeSignature/CodeResources; do
              if [[ ! -f "$HELPER/$rel" || -L "$HELPER/$rel" ]]; then
                log "::error::BTHelper.app 不完整：$rel 不是普通文件（被拆分了）"
                fail=1
              fi
            done
            plutil -lint "$HELPER/Contents/Info.plist" >>"$LOG" 2>&1 \
              || { log "::error::BTHelper.app 的 Info.plist 不合法"; fail=1; }
            codesign --verify --deep --strict "$HELPER" >>"$LOG" 2>&1 \
              || { log "::error::BTHelper.app 签名校验失败"; fail=1; }
            log "BTHelper.app 自检通过（真实 bundle + 签名有效）"
          else
            log "::warning::未找到 BTHelper.app（bt_guard 可能已被裁剪）"
          fi

          # .framework 是 bundle，内部文件签完后再整包签一次
          for fw in "$APP"/Contents/Frameworks/*.framework; do
            [[ -d "$fw" ]] || continue
            sign_one "$fw"
          done
          sign_one "$APP"

          # 外层签名必须过：封存（seal）对不上说明包被改坏了，不该产出 dmg
          if ! out=$(codesign --verify --strict "$APP" 2>&1); then
            printf '%s\n' "$out" >>"$LOG"
            log "::error::签名校验失败: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-500)"
            fail=1
          fi

          # 深层校验只告警：嵌套 .app 的封存在 PyInstaller 搬文件后本来就对不上，
          # 与主程序能否启动无关。
          if ! out=$(codesign --verify --deep --strict --verbose=2 "$APP" 2>&1); then
            printf '%s\n' "$out" >>"$LOG"
            log "::warning::深层校验未通过（嵌套 app 的既有问题）: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)"
          fi

          summary
          codesign -dvv "$APP" 2>&1 | sed -n '1,8p'
          exit "$fail"

      - name: 打包 .dmg
        run: |
          set -euo pipefail
          APP="dist/BarKit.app"
          DMG="dist/BarKit-${{ github.ref_name }}-${{ runner.arch }}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"   # 拖拽安装到「应用程序」
          hdiutil create -volname "BarKit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG }}
          generate_release_notes: true
          # 指定 body 时它会被**前置**到自动生成的 changelog 之前
          body: |
            ## 下载与安装

            1. 下载下方的 `BarKit-${{ github.ref_name }}-ARM64.dmg`（仅 Apple Silicon，要求 macOS 12+）。
            2. 双击挂载，把 **BarKit** 拖进「应用程序」。
            3. 首次启动会被 Gatekeeper 拦下（「Apple 无法验证…」）——产物只做了 ad-hoc 签名，
               没有开发者证书、也未公证。放行方式二选一：
               - 终端执行 `xattr -dr com.apple.quarantine /Applications/BarKit.app`，之后正常双击（最快）；
               - 或：系统设置 → 隐私与安全性 → 滚到「安全性」→ 点「仍要打开」→ 输入密码。
                 注意 macOS 15 起右键「打开」已不能绕过 Gatekeeper，只能走这里。

            更多说明见 [README](https://github.com/${{ github.repository }}#下载普通用户)。
